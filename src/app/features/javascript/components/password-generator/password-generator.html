<main class="page-content">
  <div class="container animation-page">
    <div class="page-header">
      <nav class="breadcrumb">
        <a routerLink="/">Home</a><span>/</span>
        <a routerLink="/javascript">JavaScript</a><span>/</span>
        <span>Password Generator</span>
      </nav>
      <h1>Password Generator</h1>
      <p>Generate strong random passwords using the Web Crypto API with configurable options.</p>
    </div>
    <div class="demo-wrapper" style="flex-direction:column; gap:24px; align-items:stretch; width:100%; max-width:480px; margin:0 auto;">

      <div class="pwd-output">
        <span class="pwd-text">{{ password() || 'Click Generate...' }}</span>
        <button class="copy-btn" (click)="copy()" [class.copied]="copied()" [disabled]="!password()">
          {{ copied() ? '✓ Copiado' : '⧉ Copiar' }}
        </button>
      </div>

      @if (password()) {
        <div class="strength-bar">
          <div class="strength-fill" [class]="strengthClass()"></div>
        </div>
        <span class="strength-text" [class]="strengthClass()">Fortaleza: {{ strengthLabel() }}</span>
      }

      <div class="options">
        <div class="option-row">
          <span>Longitud: {{ length() }}</span>
          <input type="range" [ngModel]="length()" (ngModelChange)="length.set($event)" min="6" max="64" class="range-input" />
        </div>
        <label class="option-check">
          <input type="checkbox" [ngModel]="useUppercase()" (ngModelChange)="useUppercase.set($event)" />
          <span>Mayúsculas (A-Z)</span>
        </label>
        <label class="option-check">
          <input type="checkbox" [ngModel]="useLowercase()" (ngModelChange)="useLowercase.set($event)" />
          <span>Minúsculas (a-z)</span>
        </label>
        <label class="option-check">
          <input type="checkbox" [ngModel]="useNumbers()" (ngModelChange)="useNumbers.set($event)" />
          <span>Números (0-9)</span>
        </label>
        <label class="option-check">
          <input type="checkbox" [ngModel]="useSymbols()" (ngModelChange)="useSymbols.set($event)" />
          <span>Símbolos (!&#64;#$...)</span>
        </label>
      </div>

      <button (click)="generate()" class="gen-btn">Generar Contraseña</button>
    </div>
  </div>
</main>
