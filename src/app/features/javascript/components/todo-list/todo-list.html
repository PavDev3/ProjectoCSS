<main class="page-content">
  <div class="container animation-page">
    <div class="page-header">
      <nav class="breadcrumb">
        <a routerLink="/">Home</a><span>/</span>
        <a routerLink="/javascript">JavaScript</a><span>/</span>
        <span>Todo List</span>
      </nav>
      <h1>Todo List</h1>
      <p>Task manager with Angular Signals, filters and animated interactions.</p>
    </div>
    <div class="demo-wrapper" style="align-items:flex-start; justify-content:center;">
      <div class="todo-app">
        <div class="todo-input-wrap">
          <input
            type="text"
            [(ngModel)]="newTodo"
            (keyup.enter)="addTodo()"
            placeholder="Añadir nueva tarea..."
            class="todo-input"
          />
          <button (click)="addTodo()" class="add-btn">+</button>
        </div>

        <div class="filters">
          <button (click)="setFilter('all')" [class.active]="filter() === 'all'">Todas</button>
          <button (click)="setFilter('active')" [class.active]="filter() === 'active'">Activas</button>
          <button (click)="setFilter('completed')" [class.active]="filter() === 'completed'">Completadas</button>
        </div>

        <ul class="todo-list">
          @for (todo of filteredTodos(); track todo.id) {
            <li class="todo-item" [class.done]="todo.completed">
              <button class="check-btn" (click)="toggle(todo.id)" [class.checked]="todo.completed">
                @if (todo.completed) { ✓ }
              </button>
              <span class="todo-text">{{ todo.text }}</span>
              <button class="del-btn" (click)="delete(todo.id)">✕</button>
            </li>
          }
          @empty {
            <li class="empty-state">No hay tareas</li>
          }
        </ul>

        <div class="todo-footer">
          <span>{{ activeCount() }} tarea(s) pendiente(s)</span>
          <button class="clear-btn" (click)="clearCompleted()">Limpiar completadas</button>
        </div>
      </div>
    </div>
  </div>
</main>
